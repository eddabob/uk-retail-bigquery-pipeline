name: BigQuery dbt CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dbt-bigquery-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-bigquery google-cloud-bigquery pandas pyarrow db-dtypes

      - name: Authenticate to Google Cloud
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/bq-key.json

      - name: Load sample data & run dbt build
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/bq-key.json
        run: |
          python load_to_bigquery.py
          cd retail_dbt
          dbt debug --profiles-dir ./profiles
          dbt build --profiles-dir ./profiles
